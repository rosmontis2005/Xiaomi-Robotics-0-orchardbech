# @package _global_
model:
  type: OrchardRunner
  params:
    pretrained: ${oc.env:PRETRAINED_CKPT}
    freeze_vlm: true
    diagnostic_path: null
    model:
      type: XR0
      vlm_config_path: ${oc.env:VLM_CONFIG_PATH}
      state_shape: [1, 32]
      action_shape: [30, 32]
      dit_num_layers: 16
      training_repeat: 1
      # Official frequency loss is unmasked. Disable so unused dimensions have NO loss.
      enable_freq: false
      prefix_mask_prob: 0.5
      async_train: false
