# @package _global_
trainer:
  accelerator: gpu
  precision: bf16-mixed
  num_nodes: 1
  strategy:
    type: auto
    params: {}
  optimizer:
    type: torch.optim.AdamW
    params:
      lr: 1.0e-5
      betas: [0.9, 0.95]
      weight_decay: 0.1
      eps: 1.0e-8
      foreach: false
  scheduler:
    type: torch.optim.lr_scheduler.ConstantLR
    params:
      factor: 1.0
      total_iters: 1
  seed: 42
  max_steps: 3000
  max_epochs: -1
  val_check_interval: 1.0
  limit_val_batches: 0
  num_sanity_val_steps: 0
  save_interval: 1000
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  project: orchardbench
  exp_name: cartesian_v1
  default_root_dir: ./outputs
  ckpt_path: null
  profiler: null
  enable_progress_bar: true
